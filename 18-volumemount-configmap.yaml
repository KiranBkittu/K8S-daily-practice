apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
data:
  db-password: mySecret123 

---
apiVersion: v1
kind: Pod
metadata:
  name: pod-01
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sh", "-c", "cat /etc/config/db-password && sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
  volumes:
    - name: config-volume
      configMap:
        name: mysql
