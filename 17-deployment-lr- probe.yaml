apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp
spec:
  replicas: 2
  selector:
    matchLabels:
      project: c1
      manager: vimal
      client: kvb
  template:
    metadata:
      labels:
        project: c1
        manager: vimal
        client: kvb
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.2 # this is old
          imagePullPolicy: Always
          #image: nginx # latest image
          ports:
            - protocol: TCP
              port: 80
              targetPort: 80
          readlinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10


  