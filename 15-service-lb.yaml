apiVersion: v1
kind: Service
metadata:
  name: service-np
spec:
  type: LoadBalancer
  selector:
    project: lb-k1
    company: clover
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30037
---
apiVersion: v1
kind: Pod
metadata:
  name: service-pod
  labels:
    project: lb-k1
    company: clover
spec:
  containers:
    - name: nginx
      image: nginx