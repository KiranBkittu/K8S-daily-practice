apiVersion: v1
kind: Service
metadata:
  name: service-np
spec:
  selector:
    project: c1
    company: clover
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: service-pod
  labels:
    project: c1
    company: clover
spec:
  containers:
    - name: nginx
      image: nginx